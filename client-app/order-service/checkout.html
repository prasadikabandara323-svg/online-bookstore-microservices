<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toastContainer" class="toast-container"></div>

    <!-- Header Full Width Wrapper -->
    <header class="header">
        <div class="header-content">
            <h1>💳 Checkout</h1>
            <a href="index.html" class="nav-link">⬅️ Back to Cart</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h3>Shipping Details</h3>
            <form id="checkoutForm" onsubmit="handleCheckout(event)" class="form-container">
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="address">Shipping Address</label>
                    <input type="text" id="address" placeholder="Enter delivery address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required pattern="[0-9]{10}">
                </div>

                <div class="summary-box">
                    <span>Total Payable Amount:</span>
                    <span id="checkoutTotal" class="total-price">LKR 0.00</span>
                </div>

                <button type="submit" id="placeOrderBtn" class="btn-primary btn-block">Confirm & Place Order 📦</button>
            </form>
        </div>
    </div>

    <!-- Success Modal Popup -->
    <div id="successModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>Order Placed Successfully!</h2>
            <p>Thank you for your purchase. Your order has been placed and is being processed.</p>
            
            <div class="modal-details">
                <p><strong>Order ID:</strong> <span id="modalOrderId">#---</span></p>
                <p><strong>Total Paid:</strong> <span id="modalTotalAmount">LKR 0.00</span></p>
            </div>

            <button onclick="goToOrders()" class="btn-primary btn-block">View My Orders 📦</button>
        </div>
    </div>

    <script src="checkout.js"></script>
</body>
</html>
