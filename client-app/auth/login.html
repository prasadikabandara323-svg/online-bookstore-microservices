<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In — Gayel Online Book Store</title>
  <link rel="stylesheet" href="../shared/auth.css" />
</head>
<body>
  <div id="site-header-root"></div>

  <div class="page">
    <div class="card">
      <p class="eyebrow">Welcome Back</p>
      <h1>Sign in</h1>
      <p class="subtitle">Enter your credentials to reach the front desk.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required />
        </div>

        <div id="message" class="message"></div>

        <button type="submit" class="primary" id="submitBtn">Sign in</button>
      </form>

      <p class="footline"><a href="forgot-password.html">Forgot your password?</a></p>
      <hr class="divider" />
      <p class="footline">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="../shared/header.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const data = await AuthAPI.login(email, password);
        showMessage(
          data.role === "ADMIN" ? "Welcome back, admin. Redirecting…" : "Signed in. Redirecting…",
          "success"
        );
        // NOTE: point ADMIN accounts at the admin dashboard once it exists,
        // e.g. "../admin/dashboard.html"
        setTimeout(() => (window.location.href = "profile.html"), 800);
      } catch (err) {
        showMessage(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
