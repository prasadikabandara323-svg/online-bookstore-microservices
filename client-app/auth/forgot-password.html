<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password — Gayel Online Book Store</title>
  <link rel="stylesheet" href="../shared/auth.css" />
</head>
<body>
  <div id="site-header-root"></div>

  <div class="page">
    <div class="card">
      <p class="eyebrow">Password Recovery</p>
      <h1>Forgot your password?</h1>
      <p class="subtitle">Enter your account email — we'll send a 6-digit code to reset it.</p>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane@example.com" required />
        </div>

        <div id="message" class="message"></div>

        <button type="submit" class="primary" id="submitBtn">Send reset code</button>
      </form>

      <p class="footline">Remembered it? <a href="index.html">Back to sign in</a></p>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="../shared/header.js"></script>
  <script>
    const form = document.getElementById("forgotForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      const email = document.getElementById("email").value.trim();

      try {
        await AuthAPI.forgotPassword(email);
        showMessage("Code sent. Check your inbox (and spam folder).", "success");
        setTimeout(() => {
          window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
        }, 1300);
      } catch (err) {
        showMessage(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Send reset code";
      }
    });
  </script>
</body>
</html>
