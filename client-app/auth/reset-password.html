<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password — Gayel Online Book Store</title>
  <link rel="stylesheet" href="../shared/auth.css" />
</head>
<body>
  <div id="site-header-root"></div>

  <div class="page">
    <div class="card">
      <div class="step-dots">
        <div class="dot active" id="dot1"></div>
        <div class="dot" id="dot2"></div>
      </div>

      <!-- STEP 1: enter + verify the OTP -->
      <div id="stepOtp">
        <p class="eyebrow">Password Recovery — Step 1 of 2</p>
        <h1>Enter your code</h1>
        <p class="subtitle">Type the 6-digit code we emailed you.</p>

        <form id="otpForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="jane@example.com" required />
          </div>
          <div class="field">
            <label for="otp">6-digit code</label>
            <input type="text" id="otp" placeholder="482913" inputmode="numeric" maxlength="6" required />
          </div>

          <div id="otpMessage" class="message"></div>

          <button type="submit" class="primary" id="verifyBtn">Verify code</button>
        </form>

        <p class="footline">Didn't get a code? <a href="forgot-password.html">Request a new one</a></p>
      </div>

      <!-- STEP 2: new password (shown after OTP is verified) -->
      <div id="stepPassword" style="display:none;">
        <p class="eyebrow">Password Recovery — Step 2 of 2</p>
        <h1>Choose a new password</h1>
        <p class="subtitle">Code verified. Set a new password for your account.</p>

        <form id="passwordForm">
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters" minlength="6" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your new password" minlength="6" required />
            <span class="field-hint" id="matchHint"></span>
          </div>

          <div id="passwordMessage" class="message"></div>

          <button type="submit" class="primary" id="resetBtn">Reset password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="../shared/header.js"></script>
  <script>
    // Pre-fill email if passed from the forgot-password page
    const params = new URLSearchParams(window.location.search);
    const prefillEmail = params.get("email");
    if (prefillEmail) document.getElementById("email").value = prefillEmail;

    let verifiedEmail = "";
    let verifiedOtp = "";

    // ---- Step 1: verify OTP ----
    const otpForm = document.getElementById("otpForm");
    const otpMessage = document.getElementById("otpMessage");
    const verifyBtn = document.getElementById("verifyBtn");

    function showOtpMessage(text, type) {
      otpMessage.textContent = text;
      otpMessage.className = `message show ${type}`;
    }

    otpForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying…";

      const email = document.getElementById("email").value.trim();
      const otp = document.getElementById("otp").value.trim();

      try {
        await AuthAPI.verifyOtp(email, otp);
        verifiedEmail = email;
        verifiedOtp = otp;

        // Move to step 2
        document.getElementById("stepOtp").style.display = "none";
        document.getElementById("stepPassword").style.display = "block";
        document.getElementById("dot1").classList.replace("active", "done");
        document.getElementById("dot2").classList.add("active");
      } catch (err) {
        showOtpMessage(err.message, "error");
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify code";
      }
    });

    // ---- Step 2: set new password ----
    const passwordForm = document.getElementById("passwordForm");
    const passwordMessage = document.getElementById("passwordMessage");
    const resetBtn = document.getElementById("resetBtn");
    const newPasswordEl = document.getElementById("newPassword");
    const confirmEl = document.getElementById("confirmPassword");
    const matchHint = document.getElementById("matchHint");

    function showPasswordMessage(text, type) {
      passwordMessage.textContent = text;
      passwordMessage.className = `message show ${type}`;
    }

    function checkMatch() {
      if (!confirmEl.value) {
        matchHint.textContent = "";
        return true;
      }
      const matches = newPasswordEl.value === confirmEl.value;
      matchHint.textContent = matches ? "Passwords match" : "Passwords do not match";
      matchHint.className = `field-hint ${matches ? "ok-hint" : "error-hint"}`;
      return matches;
    }

    newPasswordEl.addEventListener("input", checkMatch);
    confirmEl.addEventListener("input", checkMatch);

    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!checkMatch()) {
        showPasswordMessage("Passwords do not match.", "error");
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = "Resetting…";

      try {
        await AuthAPI.resetPassword(verifiedEmail, verifiedOtp, newPasswordEl.value);
        showPasswordMessage("Password reset. Redirecting to sign in…", "success");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        showPasswordMessage(err.message, "error");
        resetBtn.disabled = false;
        resetBtn.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
