<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account — Gayel Online Book Store</title>
  <link rel="stylesheet" href="../shared/auth.css" />
</head>
<body>
  <div id="site-header-root"></div>

  <div class="page">
    <div class="card">
      <p class="eyebrow">New Reader</p>
      <h1>Create your account</h1>
      <p class="subtitle">Join the shelves — register to start browsing and ordering.</p>

      <form id="registerForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" placeholder="Jane Austen" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="jane@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" minlength="6" required />
          <span class="field-hint" id="matchHint"></span>
        </div>

        <div id="message" class="message"></div>

        <button type="submit" class="primary" id="submitBtn">Create account</button>
      </form>

      <p class="footline">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="../shared/header.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const passwordEl = document.getElementById("password");
    const confirmEl = document.getElementById("confirmPassword");
    const matchHint = document.getElementById("matchHint");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    function checkMatch() {
      if (!confirmEl.value) {
        matchHint.textContent = "";
        return true;
      }
      const matches = passwordEl.value === confirmEl.value;
      matchHint.textContent = matches ? "Passwords match" : "Passwords do not match";
      matchHint.className = `field-hint ${matches ? "ok-hint" : "error-hint"}`;
      return matches;
    }

    passwordEl.addEventListener("input", checkMatch);
    confirmEl.addEventListener("input", checkMatch);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!checkMatch()) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = passwordEl.value;

      try {
        await AuthAPI.register(fullName, email, password);
        showMessage("Account created. Redirecting to sign in…", "success");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        showMessage(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
