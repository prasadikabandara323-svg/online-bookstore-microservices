<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Bookstore</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: rgba(26, 26, 30, 0.95);
            --primary-amber: #E2953B;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --border-color: rgba(226, 149, 59, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { color: var(--primary-amber); font-size: 1.4rem; }
        
        .back-btn {
            background: rgba(226, 149, 59, 0.15); color: var(--primary-amber);
            border: 1px solid var(--border-color); padding: 6px 14px;
            border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 0.85rem;
        }

        .clear-btn {
            background: rgba(255, 77, 77, 0.2); color: #ff6b6b;
            border: 1px solid #ff4d4d; padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 0.8rem; margin-bottom: 15px;
        }

        .notification-card {
            background: #18181c;
            border-left: 4px solid var(--primary-amber);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .notif-title { font-weight: bold; color: var(--primary-amber); margin-bottom: 4px; font-size: 0.95rem; }
        .notif-msg { font-size: 0.85rem; color: var(--text-main); margin-bottom: 6px; }
        .notif-time { font-size: 0.75rem; color: var(--text-muted); text-align: right; }
        .empty-msg { text-align: center; color: var(--text-muted); padding: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🔔 Notifications</h2>
        <a href="payment.html" class="back-btn">⬅️ Back to Pay</a>
    </div>

    <button class="clear-btn" onclick="clearNotifications()">Clear All Notifications</button>

    <div id="notificationList"></div>
</div>

<script>
    function loadNotifications() {
        const listContainer = document.getElementById('notificationList');
        const notifications = JSON.parse(localStorage.getItem('user_notifications')) || [];

        if (notifications.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">No notifications yet!</div>';
            return;
        }

        listContainer.innerHTML = notifications.map(notif => `
            <div class="notification-card">
                <div class="notif-title">✅ Payment Successful (${notif.orderId})</div>
                <div class="notif-msg">${notif.message}</div>
                <div class="notif-time">⏱️ ${notif.timestamp}</div>
            </div>
        `).join('');
    }

    function clearNotifications() {
        localStorage.removeItem('user_notifications');
        loadNotifications();
    }

    // Page Load වෙද්දි Call කිරීම
    loadNotifications();
</script>

</body>
</html>
