<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Bookstore</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: rgba(26, 26, 30, 0.95);
            --primary-amber: #E2953B;
            --primary-orange: #C25900;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --input-bg: #18181c;
            --border-color: rgba(226, 149, 59, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .back-btn {
            background: rgba(255,255,255,0.06); color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.15); padding: 6px 12px;
            border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 0.85rem;
        }
        .back-btn:hover { border-color: var(--primary-amber); color: var(--primary-amber); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h2 { color: var(--primary-amber); font-size: 1.4rem; }
        .history-btn {
            background: rgba(226, 149, 59, 0.15); color: var(--primary-amber);
            border: 1px solid var(--border-color); padding: 6px 14px;
            border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 0.85rem;
        }

        /* Tabs */
        .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--input-bg); padding: 4px; border-radius: 10px; }
        .tab-btn {
            flex: 1; padding: 8px; text-align: center; border-radius: 8px; cursor: pointer;
            font-size: 0.85rem; color: var(--text-muted); border: none; background: transparent;
        }
        .tab-btn.active { background: var(--primary-amber); color: #1a1a1a; font-weight: bold; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .section-title {
            font-size: 0.9rem; color: var(--primary-amber); margin: 16px 0 8px 0;
            font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-control {
            width: 100%; padding: 10px 12px; background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
            color: var(--text-main); font-size: 0.9rem; outline: none;
        }
        .form-control:focus { border-color: var(--primary-amber); }
        .form-control[readonly] { background: rgba(255, 255, 255, 0.05); color: var(--primary-amber); font-weight: bold; }

        .method-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px;
        }

        .method-card {
            background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 10px 4px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .method-card:hover, .method-card.active {
            border-color: var(--primary-amber); background: rgba(226, 149, 59, 0.2);
        }
        .method-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
        .method-title { font-size: 0.7rem; color: var(--text-main); line-height: 1.1; }

        .payment-form-panel {
            display: none; background: rgba(0,0,0,0.3); padding: 16px;
            border-radius: 10px; border: 1px solid var(--border-color); margin-top: 16px;
        }
        .payment-form-panel.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .pay-now-btn {
            width: 100%; background: linear-gradient(135deg, var(--primary-orange), var(--primary-amber));
            color: #fff; border: none; padding: 12px; border-radius: 8px;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 12px; transition: 0.3s;
        }
        .pay-now-btn:hover { opacity: 0.9; }
        .row { display: flex; gap: 10px; }

        /* CRUD (My Payments) tab */
        .search-row { display: flex; gap: 8px; }
        .search-row .form-control { flex: 1; }
        .btn-small {
            background: var(--primary-amber); color: #1a1a1a; border: none;
            padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .payment-item {
            background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 0.85rem;
        }
        .payment-item .row-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .payment-item .actions { display: flex; gap: 6px; margin-top: 8px; }
        .status-select {
            background: var(--input-bg); color: var(--text-main); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; padding: 4px; font-size: 0.8rem;
        }
        .btn-update { background: rgba(226,149,59,0.2); color: var(--primary-amber); border: 1px solid var(--border-color); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.75rem; }
        .btn-delete { background: rgba(220,50,50,0.15); color: #ff6b6b; border: 1px solid rgba(220,50,50,0.4); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.75rem; }
        .muted-note { color: var(--text-muted); font-size: 0.8rem; margin-top: 8px; }
    </style>
</head>
<body>

<div class="payment-card">

    <div class="top-bar">
        <a href="http://localhost:3000/checkout.html" class="back-btn">⬅️ Back</a>
    </div>

    <div class="header">
        <h2>💳 Payments</h2>
        <a href="notification.html" class="history-btn">🔔 Notifications</a>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('checkout', this)">Checkout</button>
        <button class="tab-btn" onclick="switchTab('manage', this)">My Payments</button>
    </div>

    <!-- ============ TAB 1: CHECKOUT (Create) ============ -->
    <div id="tab-checkout" class="tab-panel active">

        <div class="section-title">Contact Info</div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="customerName" class="form-control" placeholder="Enter full name" required>
        </div>
        <div class="form-group">
            <label>Contact Number</label>
            <input type="tel" id="contactNo" class="form-control" placeholder="Enter contact number" required>
        </div>

        <div class="section-title">Billing Summary</div>
        <div class="form-group">
            <label>Selected Books / Items</label>
            <input type="text" id="displayDescription" class="form-control" readonly>
        </div>
        <div class="form-group">
            <label>Total Amount (LKR)</label>
            <input type="text" id="displayAmount" class="form-control" readonly>
        </div>

        <div class="section-title">Pay With</div>
        <div class="method-grid">
            <div class="method-card active" onclick="switchMethod('card', this)">
                <span class="method-icon">💳</span>
                <span class="method-title">Credit/Debit card</span>
            </div>
            <div class="method-card" onclick="switchMethod('wallet', this)">
                <span class="method-icon">📱</span>
                <span class="method-title">Mobile wallets</span>
            </div>
            <div class="method-card" onclick="switchMethod('insurance', this)">
                <span class="method-icon">🛡️</span>
                <span class="method-title">Insurance Integration</span>
            </div>
            <div class="method-card" onclick="switchMethod('bank', this)">
                <span class="method-icon">🏦</span>
                <span class="method-title">Bank transfer</span>
            </div>
        </div>

        <div id="form-card" class="payment-form-panel active">
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" class="form-control" placeholder="4532 •••• •••• 8921">
            </div>
            <div class="row">
                <div class="form-group" style="flex:1;">
                    <label>Expiry Date</label>
                    <input type="text" class="form-control" placeholder="MM/YY">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>CVV</label>
                    <input type="password" class="form-control" placeholder="123">
                </div>
            </div>
            <button class="pay-now-btn" onclick="submitPayment('Credit/Debit Card')">Pay Now ➔</button>
        </div>

        <div id="form-wallet" class="payment-form-panel">
            <div class="form-group">
                <label>Select Wallet Provider</label>
                <select class="form-control">
                    <option>eZ Cash</option>
                    <option>mCash</option>
                    <option>Genie</option>
                    <option>iPay</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" class="form-control" placeholder="07X XXX XXXX">
            </div>
            <button class="pay-now-btn" onclick="submitPayment('Mobile Wallet')">Pay via Wallet ➔</button>
        </div>

        <div id="form-insurance" class="payment-form-panel">
            <div class="form-group">
                <label>Insurance Provider</label>
                <select class="form-control">
                    <option>SLIC Student Care</option>
                    <option>Ceylinco VIP Education</option>
                    <option>Union Assurance</option>
                </select>
            </div>
            <div class="form-group">
                <label>Policy / Student Claim Number</label>
                <input type="text" class="form-control" placeholder="POL-998234">
            </div>
            <button class="pay-now-btn" onclick="submitPayment('Insurance Claim')">Submit Claim & Pay ➔</button>
        </div>

        <div id="form-bank" class="payment-form-panel">
            <div class="form-group">
                <label>Select Bank</label>
                <select class="form-control">
                    <option>Commercial Bank</option>
                    <option>Sampath Bank</option>
                    <option>BOC</option>
                    <option>HNB</option>
                </select>
            </div>
            <div class="form-group">
                <label>Transaction Reference / Slip No</label>
                <input type="text" class="form-control" placeholder="REF-884920">
            </div>
            <button class="pay-now-btn" onclick="submitPayment('Bank Transfer')">Confirm Bank Payment ➔</button>
        </div>

    </div>

    <!-- ============ TAB 2: MY PAYMENTS (Read / Update / Delete) ============ -->
    <div id="tab-manage" class="tab-panel">
        <div class="section-title">Find Your Payments</div>
        <div class="search-row">
            <input type="text" id="searchOrderId" class="form-control" placeholder="Enter Order ID (e.g. ORD-1234)">
            <button class="btn-small" onclick="searchByOrder()">Search</button>
        </div>
        <p class="muted-note">Enter the Order ID shown on your receipt / notification to view, update, or delete that payment.</p>

        <div id="manageResults"></div>
    </div>

</div>

<script>
    const API_BASE = 'http://localhost:8084';
    const API_KEY = 'YOUR_SECRET_API_KEY_HERE';

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || 'USER_' + Math.floor(100 + Math.random() * 900);
    const orderId = urlParams.get('orderId') || 'ORD-' + Math.floor(1000 + Math.random() * 9000);
    const booksTitle = urlParams.get('books') || urlParams.get('description') || 'Madol Doova, Gamperaliya Books';
    const rawAmount = urlParams.get('amount') || '2500';

    document.getElementById('displayDescription').value = booksTitle;
    document.getElementById('displayAmount').value = 'RS: LKR ' + parseFloat(rawAmount).toLocaleString('en-US', {minimumFractionDigits: 2}) + '=';

    function switchTab(tabName, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + tabName).classList.add('active');
    }

    function switchMethod(methodType, element) {
        document.querySelectorAll('.method-card').forEach(card => card.classList.remove('active'));
        document.querySelectorAll('.payment-form-panel').forEach(panel => panel.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('form-' + methodType).classList.add('active');
    }

    // ---------- CREATE ----------
    async function submitPayment(selectedMethod) {
        const name = document.getElementById('customerName').value.trim();
        const contact = document.getElementById('contactNo').value.trim();

        if (!name || !contact) {
            alert('Please enter your Full Name and Contact Number!');
            return;
        }

        const paymentData = {
            userId: userId,
            orderId: orderId,
            customerName: name,
            contactNo: contact,
            description: booksTitle,
            amount: parseFloat(rawAmount),
            paymentMethod: selectedMethod,
            status: "SUCCESS"
        };

        try {
            const response = await fetch(`${API_BASE}/payments/process`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY },
                body: JSON.stringify(paymentData)
            });

            if (response.ok) {
                const result = await response.json();
                saveNotification({
                    id: result.id || Date.now(),
                    orderId: orderId,
                    amount: rawAmount,
                    status: 'SUCCESS',
                    message: `Payment of LKR ${rawAmount} for ${booksTitle} was successful!`,
                    timestamp: new Date().toLocaleString()
                });
                alert('Payment Successful!');
                window.location.href = `notification.html`;
            } else {
                alert('Backend Error! Status: ' + response.status);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Could not connect to Backend server! Check if Spring Boot is running on port 8084.');
        }
    }

    function saveNotification(notification) {
        let notifications = JSON.parse(localStorage.getItem('user_notifications')) || [];
        notifications.unshift(notification);
        localStorage.setItem('user_notifications', JSON.stringify(notifications));
    }

    // ---------- READ ----------
    async function searchByOrder() {
        const oid = document.getElementById('searchOrderId').value.trim();
        const resultsDiv = document.getElementById('manageResults');
        if (!oid) { alert('Please enter an Order ID'); return; }

        resultsDiv.innerHTML = '<p class="muted-note">Loading...</p>';
        try {
            const res = await fetch(`${API_BASE}/payments/order/${oid}`, {
                headers: { 'X-API-KEY': API_KEY }
            });
            if (!res.ok) {
                resultsDiv.innerHTML = `<p class="muted-note">No record found (Status: ${res.status})</p>`;
                return;
            }
            const payment = await res.json();
            renderPayment(payment);
        } catch (err) {
            resultsDiv.innerHTML = '<p class="muted-note">Could not connect to backend server.</p>';
        }
    }

    function renderPayment(p) {
        const resultsDiv = document.getElementById('manageResults');
        resultsDiv.innerHTML = `
            <div class="payment-item">
                <div class="row-line"><span>Order ID</span><strong>${p.orderId}</strong></div>
                <div class="row-line"><span>Customer</span><strong>${p.customerName || '-'}</strong></div>
                <div class="row-line"><span>Amount</span><strong>LKR ${p.amount}</strong></div>
                <div class="row-line"><span>Method</span><strong>${p.paymentMethod || '-'}</strong></div>
                <div class="row-line">
                    <span>Status</span>
                    <select class="status-select" id="statusSelect">
                        ${['PENDING','SUCCESS','FAILED','REFUNDED'].map(s =>
                            `<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}
                    </select>
                </div>
                <div class="actions">
                    <button class="btn-update" onclick="updateStatus('${p.id}')">Update Status</button>
                    <button class="btn-delete" onclick="deletePayment('${p.id}')">Delete</button>
                </div>
            </div>
        `;
    }

    // ---------- UPDATE ----------
    async function updateStatus(id) {
        const newStatus = document.getElementById('statusSelect').value;
        try {
            const res = await fetch(`${API_BASE}/payments/update-status/${id}?status=${encodeURIComponent(newStatus)}`, {
                method: 'PUT',
                headers: { 'X-API-KEY': API_KEY }
            });
            if (res.ok) {
                alert('Status updated!');
                searchByOrder();
            } else {
                alert('Update failed: ' + res.status);
            }
        } catch (err) {
            alert('Backend එකට connect වෙන්න බැරි වුණා.');
        }
    }

    // ---------- DELETE ----------
    async function deletePayment(id) {
        if (!confirm('Are you sure you want to delete this payment record?')) return;
        try {
            const res = await fetch(`${API_BASE}/payments/${id}`, {
                method: 'DELETE',
                headers: { 'X-API-KEY': API_KEY }
            });
            if (res.status === 204) {
                alert('Deleted!');
                document.getElementById('manageResults').innerHTML = '<p class="muted-note">Record deleted successfully.</p>';
            } else {
                alert('Delete failed: ' + res.status);
            }
        } catch (err) {
            alert('Could not connect to backend server.');
        }
    }
</script>

</body>
</html>
