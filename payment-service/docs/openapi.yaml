openapi: 3.0.3
info:
  title: Payment Service API
  description: Online Bookstore - Payment microservice
  version: 1.0.0
servers:
  - url: http://localhost:8084
    description: Local dev server

security:
  - ApiKeyAuth: []

paths:
  /payments/create:
    post:
      summary: Create a new payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: Missing or invalid API key

  /payments/process:
    post:
      summary: Process a payment (alias of /create, used by checkout UI)
      operationId: processPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /payments/order/{orderId}:
    get:
      summary: Get payment(s) by order ID
      operationId: getPaymentByOrderId
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /payments/method/{paymentMethod}:
    get:
      summary: Get all payments by payment method
      operationId: getPaymentsByMethod
      parameters:
        - name: paymentMethod
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

  /payments/update-status/{id}:
    put:
      summary: Update the status of a payment
      operationId: updatePaymentStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [SUCCESS, PENDING, FAILED, REFUNDED]
      responses:
        '200':
          description: Payment updated

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY

  schemas:
    PaymentRequest:
      type: object
      properties:
        userId:
          type: string
        orderId:
          type: string
        customerName:
          type: string
        contactNo:
          type: string
        description:
          type: string
        amount:
          type: number
        paymentMethod:
          type: string
        status:
          type: string

    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentRequest'
        - type: object
          properties:
            id:
              type: string
            timestamp:
              type: string
              format: date-time