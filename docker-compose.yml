version: "3.8"

services:
version: '3.8'

services:
  # 1. Central MongoDB Database for the Microservices
  mongo:
    image: mongo:7
    container_name: bookstore-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/paymentdb
      API_SECURITY_KEY: YOUR_SECRET_API_KEY_HERE
    depends_on:
      - mongo
    restart: always

  # 2. Book Catalog Service 
  book-catalog-service:
    build:
      context: ./book-catalog-service
    container_name: book-catalog-service
    ports:
      - "8082:8082"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/bookstore_db
      - API_KEY=YOUR_SECRET_API_KEY_HERE
    depends_on:
      - mongo
    restart: always

  # 3. Book Catalog Swagger UI Documentation
  book-catalog-docs:
    image: swaggerapi/swagger-ui
    container_name: book-catalog-swagger
    ports:
      - "9090:8080"
    environment:
      - SWAGGER_JSON=/docs/openapi.yaml
    volumes:
      - ./book-catalog-service/docs:/docs
    depends_on:
      - book-catalog-service
    restart: always

  # 4. Book Catalog Frontend UI
  book-catalog-client:
    build:
      context: ./client-app
    container_name: book-catalog-client
    ports:
      - "8087:80"
    depends_on:
      - book-catalog-service
      - order-service
    restart: always

  # 5. Order Service (Backend Microservice)
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service-app
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/bookstore_db
    depends_on:
      - mongo
    restart: always

  # 6. Order Service Swagger UI Documentation
  order-service-docs:
    image: swaggerapi/swagger-ui
    container_name: order-service-swagg
    ports:
      - "8085:8080"
    environment:
      - SWAGGER_JSON_URL=http://localhost:8083/v3/api-docs
    depends_on:
      - order-service
    restart: always

  # 7. Order Service Frontend UI
  order-service-client:
    build:
      context: ./client-app/order-service
    container_name: bookstore-client
    ports:
      - "3000:80"
    depends_on:
      - order-service
    restart: always

volumes:
  mongo-data: